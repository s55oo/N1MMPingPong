# One line per station:  IP,label,color   (lines starting with # are skipped)
# New stations are detected automatically and assigned a color in order of
# appearance (red, orange, light blue, light green, ...). The entry is written
# back to this file so the color stays fixed. Edit any line to override.
#
# Example:
# 192.168.178.55,PC1,red
# 192.168.178.56,Run2,orange
192.168.178.55,OO840G4,red
