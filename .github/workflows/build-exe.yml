name: Build n1mm_lamps.exe

# Builds the standalone exe on a clean GitHub Windows runner, with the
# PyInstaller bootloader compiled from source (the prebuilt one is what
# antivirus engines fingerprint - Trojan:Win32/Wacatac.B!ml false positives).
# Result is an artifact of the run.
#
# Every run first runs the automated tests (tests/, Python's unittest);
# if one fails nothing is built or released. Both exes get Windows version
# information, and a Defender scan must come back clean before a release
# is published.
#
# Automatic releases: on every push to main the version is read from
# __version__ in pingpong_version.py. If release v<version> doesn't exist yet,
# the tag and release are created and the exe is attached. Release notes
# come from releases/v<version>.md if present, otherwise GitHub generates
# them. So to publish: bump __version__ (and add releases/vX.Y.md), push.
# An existing release is never overwritten by a main push; pushing a v*
# tag by hand re-uploads the exe to that tag's release.

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

env:
  PYINSTALLER_VERSION: "6.22.2"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      # PyInstaller's runtime deps first, then PyInstaller itself from the
      # sdist: pip compiles the bootloader with the runner's MSVC.
      - name: Install PyInstaller (bootloader compiled from source)
        run: |
          python -m pip install altgraph packaging pefile pyinstaller-hooks-contrib pywin32-ctypes setuptools
          python -m pip install --no-binary pyinstaller --no-deps "pyinstaller==$env:PYINSTALLER_VERSION"
          python -m PyInstaller --version

      - name: Tests
        run: python -m unittest discover -s tests -t tests -v

      - name: Build
        run: |
          python tools/make_version_info.py
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python -m PyInstaller --onefile --windowed --noupx --name n1mm_lamps --manifest manifest.xml --icon pingpong.ico --version-file build\version_n1mm_lamps.txt n1mm_lamps.py
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python -m PyInstaller --onefile --windowed --noupx --name pingpong_overview --manifest manifest.xml --icon pingpong.ico --version-file build\version_pingpong_overview.txt --add-data "pingpong.ico;." pingpong_overview.py
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # SHA256SUMS.txt (sha256sum format: "<hash> *<file>") goes with the
      # release and its hashes into the release notes, so anyone can check
      # a download by hand. The updaters also verify every download.
      - name: SHA-256
        run: |
          if (Test-Path docs/PingPong-cheat-sheet.pdf) { Copy-Item docs/PingPong-cheat-sheet.pdf dist/ }
          $lines = @()
          foreach ($f in "n1mm_lamps.exe", "pingpong_overview.exe", "PingPong-cheat-sheet.pdf") {
            if (-not (Test-Path "dist\$f")) { continue }
            $h = (Get-FileHash "dist\$f" -Algorithm SHA256).Hash.ToLower()
            $lines += "$h *$f"
            "$f SHA-256 $h"
            "**$f** SHA-256: ``$h``" >> $env:GITHUB_STEP_SUMMARY
          }
          [IO.File]::WriteAllText("$PWD\dist\SHA256SUMS.txt", ($lines -join "`n") + "`n")

      # A build Defender flags is never released (the job stops here).
      # If Defender itself cannot run on the runner, that is only a warning.
      - name: Defender scan
        run: |
          try {
            Update-MpSignature -ErrorAction SilentlyContinue
            Start-MpScan -ScanType CustomScan -ScanPath "$PWD\dist" -ErrorAction Stop
          } catch {
            "::warning::Defender scan could not run: $_"
            exit 0
          }
          $t = Get-MpThreatDetection | Where-Object { $_.Resources -match 'dist' }
          if ($t) {
            $t | Format-List ThreatID, Resources
            "::error::Defender flagged the build - not released"
            "**Defender flagged the build - not released**" >> $env:GITHUB_STEP_SUMMARY
            exit 1
          }
          "Defender: clean"
          "Defender: clean" >> $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v6
        with:
          name: pingpong-exes
          path: |
            dist/n1mm_lamps.exe
            dist/pingpong_overview.exe
          if-no-files-found: error

      - name: Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/*') {
            $tag = $env:GITHUB_REF_NAME
          } else {
            $m = Select-String -Path pingpong_version.py -Pattern '^__version__\s*=\s*"([^"]+)"'
            if (-not $m) { "No __version__ found - skipping release"; exit 0 }
            $tag = "v" + $m.Matches[0].Groups[1].Value
          }
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          $exists = ($LASTEXITCODE -eq 0)
          if ($exists -and $env:GITHUB_REF -notlike 'refs/tags/*') {
            "Release $tag already exists - nothing to do"; exit 0
          }
          if (-not $exists) {
            $notes = "releases/$tag.md"
            $text = if (Test-Path $notes) { Get-Content $notes -Raw } else { "## PingPong $tag`n" }
            $text += "`n`n### SHA-256`n`n``````n" + (Get-Content dist/SHA256SUMS.txt -Raw) + "``````n"
            $text += "`nCheck a download in PowerShell: ``Get-FileHash .\n1mm_lamps.exe`` (or ``certutil -hashfile n1mm_lamps.exe SHA256``) and compare with the line above.`n"
            [IO.File]::WriteAllText("$PWD\dist\notes.md", $text)
            gh release create $tag --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "PingPong $tag" --notes-file dist/notes.md
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
          gh release upload $tag dist/n1mm_lamps.exe dist/pingpong_overview.exe dist/SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # The operator cheat sheet (one A4 page) goes with every release too.
          if (Test-Path dist/PingPong-cheat-sheet.pdf) {
            gh release upload $tag dist/PingPong-cheat-sheet.pdf --repo $env:GITHUB_REPOSITORY --clobber
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
          "Released $tag" >> $env:GITHUB_STEP_SUMMARY
