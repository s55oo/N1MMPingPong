name: Build n1mm_lamps.exe

# Builds the standalone exe on a clean GitHub Windows runner, with the
# PyInstaller bootloader compiled from source (the prebuilt one is what
# antivirus engines fingerprint - Trojan:Win32/Wacatac.B!ml false positives).
# Result is an artifact of the run.
#
# Automatic releases: on every push to main the version is read from
# __version__ in n1mm_lamps.py. If release v<version> doesn't exist yet,
# the tag and release are created and the exe is attached. Release notes
# come from releases/v<version>.md if present, otherwise GitHub generates
# them. So to publish: bump __version__ (and add releases/vX.Y.md), push.
# An existing release is never overwritten by a main push; pushing a v*
# tag by hand re-uploads the exe to that tag's release.

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

env:
  PYINSTALLER_VERSION: "6.22.2"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      # PyInstaller's runtime deps first, then PyInstaller itself from the
      # sdist: pip compiles the bootloader with the runner's MSVC.
      - name: Install PyInstaller (bootloader compiled from source)
        run: |
          python -m pip install altgraph packaging pefile pyinstaller-hooks-contrib pywin32-ctypes setuptools
          python -m pip install --no-binary pyinstaller --no-deps "pyinstaller==$env:PYINSTALLER_VERSION"
          python -m PyInstaller --version

      - name: Build
        run: python -m PyInstaller --onefile --windowed --noupx --name n1mm_lamps --manifest manifest.xml --icon pingpong.ico n1mm_lamps.py

      - name: SHA-256
        run: |
          $h = (Get-FileHash dist\n1mm_lamps.exe -Algorithm SHA256).Hash
          "SHA-256 $h"
          "**n1mm_lamps.exe** SHA-256: ``$h``" >> $env:GITHUB_STEP_SUMMARY

      # Informational: does Defender flag the fresh build? Never fails the job.
      - name: Defender scan
        continue-on-error: true
        run: |
          Start-MpScan -ScanType CustomScan -ScanPath "$PWD\dist\n1mm_lamps.exe"
          $t = Get-MpThreatDetection
          if ($t) { $t | Format-List ThreatID, Resources; "Defender flagged the build" } else { "Defender: clean" }

      - uses: actions/upload-artifact@v6
        with:
          name: n1mm_lamps.exe
          path: dist/n1mm_lamps.exe
          if-no-files-found: error

      - name: Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/*') {
            $tag = $env:GITHUB_REF_NAME
          } else {
            $m = Select-String -Path n1mm_lamps.py -Pattern '^__version__\s*=\s*"([^"]+)"'
            if (-not $m) { "No __version__ found - skipping release"; exit 0 }
            $tag = "v" + $m.Matches[0].Groups[1].Value
          }
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          $exists = ($LASTEXITCODE -eq 0)
          if ($exists -and $env:GITHUB_REF -notlike 'refs/tags/*') {
            "Release $tag already exists - nothing to do"; exit 0
          }
          if (-not $exists) {
            $notes = "releases/$tag.md"
            if (Test-Path $notes) {
              gh release create $tag --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "PingPong $tag" --notes-file $notes
            } else {
              gh release create $tag --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "PingPong $tag" --generate-notes
            }
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
          gh release upload $tag dist/n1mm_lamps.exe --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { exit 1 }
          "Released $tag" >> $env:GITHUB_STEP_SUMMARY
