# Example for lamps.cfg - copy to lamps.cfg next to n1mm_lamps.exe (optional).
# One line per station:  IP,label,color   (lines starting with # are skipped)
# Not needed: stations are detected automatically and get their color from
# the master lamp. The lamp never writes this file. A color here is used only
# for a station whose PC runs no lamp and isn't in the master's color list
# yet. A color chosen with Options > My color... on that PC always wins.
#
# 192.168.178.55,PC1,red
# 192.168.178.56,Run2,orange
